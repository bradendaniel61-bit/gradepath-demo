<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gradepath — GPA and grade management for high schools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F2F4F8;
    --surface: #FFFFFF;
    --ink: #101A30;
    --muted: #5B6780;
    --line: #D9DFEA;
    --accent: #2447F5;
    --accent-ink: #FFFFFF;
    --soft: #E4EAFF;
    --bad: #C62828;
    --ok: #1B7A46;
    --warn: #A65F00;
    --font-display: "Bricolage Grotesque", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    --font-body: "DM Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0E1424;
      --surface: #161E33;
      --ink: #EEF2FB;
      --muted: #9AA7C2;
      --line: #27324D;
      --accent: #7C97FF;
      --accent-ink: #0E1424;
      --soft: #22305A;
      --bad: #FF8A80;
      --ok: #67D39B;
      --warn: #F0B35A;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1424;
    --surface: #161E33;
    --ink: #EEF2FB;
    --muted: #9AA7C2;
    --line: #27324D;
    --accent: #7C97FF;
    --accent-ink: #0E1424;
    --soft: #22305A;
    --bad: #FF8A80;
    --ok: #67D39B;
    --warn: #F0B35A;
    color-scheme: dark;
  }

  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: inherit; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3 { font-family: var(--font-display); letter-spacing: -0.02em; margin: 0; }
  h1 { font-weight: 800; font-size: clamp(28px, 6vw, 42px); line-height: 1.05; }
  h2 { font-weight: 700; font-size: 22px; line-height: 1.15; }
  h3 { font-weight: 700; font-size: 17px; }
  p { margin: 0; }

  .wrap { max-width: 900px; margin: 0 auto; padding: 20px 16px 56px; }
  .wrap.narrow { max-width: 540px; }
  .stack > * + * { margin-top: 28px; }
  .stack-s > * + * { margin-top: 12px; }

  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* Top bar and navigation */
  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    max-width: 900px; margin: 0 auto; padding: 14px 16px 0;
  }
  .brand { font-family: var(--font-display); font-weight: 800; font-size: 22px; letter-spacing: -0.03em; }
  .brand b { color: var(--accent); font-weight: 800; }
  .who-now { display: flex; align-items: center; gap: 10px; min-width: 0; font-size: 14px; color: var(--muted); }
  .who-now span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 160px; }

  .tabs {
    display: flex; gap: 4px; max-width: 900px; margin: 10px auto 0; padding: 0 16px;
    border-bottom: 1px solid var(--line);
  }
  .tabs button {
    font: inherit; font-weight: 500; color: var(--muted); background: transparent;
    border: 0; border-bottom: 3px solid transparent; padding: 10px 14px 9px; cursor: pointer; min-height: 44px;
  }
  .tabs button[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 700; }
  .tabs button:hover { color: var(--ink); }

  /* Buttons and fields */
  .btn, .link {
    font: inherit; font-weight: 500; color: var(--ink); background: transparent;
    border: 1px solid var(--line); border-radius: 10px; min-height: 44px; padding: 8px 16px; cursor: pointer;
  }
  .btn:hover:not(:disabled) { border-color: var(--muted); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
  .btn.primary:hover:not(:disabled) { filter: brightness(1.08); border-color: var(--accent); }
  .btn.small { min-height: 36px; padding: 4px 12px; font-size: 14px; }
  .btn.danger, .btn.danger:hover { color: var(--bad); border-color: var(--bad); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .link { border: 0; padding: 4px 0; min-height: 36px; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

  input[type="text"], input[type="password"], input[type="search"], select, textarea {
    width: 100%; font: inherit; color: var(--ink); background: var(--surface);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 44px;
  }
  textarea { min-height: 110px; resize: vertical; font-size: 14px; }
  input::placeholder, textarea::placeholder { color: var(--muted); opacity: 0.8; }
  input.invalid { border-color: var(--bad); }
  label.field { display: block; font-size: 14px; color: var(--muted); }
  label.field > :not(span) { margin-top: 4px; color: var(--ink); }
  .fields { display: grid; gap: 14px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .note { font-size: 14px; color: var(--muted); max-width: 62ch; }
  .err { font-size: 14px; color: var(--bad); min-height: 1.4em; }
  .good { color: var(--ok); }
  .bad { color: var(--bad); }
  .warn { color: var(--warn); }

  /* Login */
  .big-title { margin: 22px 0 10px; }
  .intro { color: var(--muted); max-width: 52ch; margin-bottom: 26px; }
  .who-list { display: grid; gap: 8px; margin: 12px 0 16px; }
  .who {
    display: flex; align-items: center; gap: 12px; text-align: left; width: 100%;
    font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line);
    border-radius: 12px; padding: 10px 14px; min-height: 56px; cursor: pointer;
  }
  .who:hover { border-color: var(--accent); }
  .avatar {
    flex: none; width: 36px; height: 36px; border-radius: 50%; background: var(--soft); color: var(--accent);
    display: grid; place-items: center; font-family: var(--font-display); font-weight: 800;
  }
  .who-text { display: flex; flex-direction: column; min-width: 0; }
  .who-text small { color: var(--muted); font-size: 13px; }
  .foot { margin-top: 30px; padding-top: 14px; border-top: 1px solid var(--line); }

  /* Hero */
  .hero {
    display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    background: var(--ink); color: var(--bg); border-radius: 14px; padding: 18px 22px;
  }
  .hero .label { font-size: 14px; opacity: 0.75; }
  .hero .big {
    font-family: var(--font-display); font-weight: 800; font-size: clamp(44px, 12vw, 68px);
    line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums;
  }
  .stats { display: flex; flex-wrap: wrap; gap: 8px 22px; margin: 0; }
  .stats dt { font-size: 13px; opacity: 0.75; }
  .stats dd { margin: 2px 0 0; font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }
  .strip { display: flex; flex-wrap: wrap; gap: 8px 28px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .strip .stats dt, .strip dt { color: var(--muted); opacity: 1; }
  .strip .stats { margin: 0; }

  .head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }

  /* Term chips */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    font: inherit; font-size: 14px; font-weight: 500; color: var(--ink); background: var(--surface);
    border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; min-height: 40px; cursor: pointer;
  }
  .chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
  .chip.add { border-style: dashed; color: var(--accent); }

  /* Class rows */
  .rows { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .row {
    display: grid; grid-template-columns: minmax(0, 1fr) 92px 84px;
    grid-template-areas: "name grade out" "opts opts opts";
    align-items: center; gap: 10px 12px; padding: 14px 0; border-bottom: 1px solid var(--line);
  }
  .row .name { grid-area: name; }
  .row .grade { grid-area: grade; font-variant-numeric: tabular-nums; font-weight: 500; }
  .row .out { grid-area: out; }
  .row .opts { grid-area: opts; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
  .opts .seg { flex: 1 1 300px; }
  .opts .seg.two-up { flex: 0 1 200px; }
  .opts .extra { flex: 1 1 260px; display: flex; gap: 8px; align-items: center; }
  .opts .extra select { min-height: 40px; padding: 6px 10px; }
  .seg { display: grid; grid-template-columns: repeat(auto-fit, minmax(74px, 1fr)); gap: 6px; }
  .seg.two-up { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .seg button, .toggle {
    font: inherit; font-size: 14px; font-weight: 500; color: var(--ink); background: var(--surface);
    border: 1px solid var(--line); border-radius: 10px; min-height: 44px; padding: 4px 8px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.15; white-space: nowrap;
  }
  .toggle { flex-direction: row; min-height: 40px; padding: 4px 12px; flex: none; }
  .seg button .mx { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .seg button[aria-pressed="true"], .toggle[aria-pressed="true"] {
    background: var(--accent); border-color: var(--accent); color: var(--accent-ink);
  }
  .seg button[aria-pressed="true"] .mx { color: var(--accent-ink); opacity: 0.85; }
  .out { text-align: right; font-family: var(--font-display); font-weight: 700; font-size: 20px; font-variant-numeric: tabular-nums; }
  .out.empty { color: var(--muted); font-weight: 500; }
  .out.bad { font-size: 13px; font-family: var(--font-body); font-weight: 500; }
  .empty-state { padding: 22px 0; color: var(--muted); }

  /* Tables */
  .tbl-wrap { overflow-x: auto; max-width: 100%; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 15px; }
  th, td { text-align: left; padding: 10px 12px 10px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { font-size: 13px; font-weight: 500; color: var(--muted); }
  td.r, th.r { text-align: right; padding-right: 0; padding-left: 12px; }
  th button { font: inherit; font-size: 13px; color: var(--muted); background: transparent; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  th button[aria-pressed="true"] { color: var(--ink); font-weight: 700; }

  /* Chart */
  .chart { max-width: 560px; }
  .chart svg { width: 100%; height: auto; display: block; }
  .chart .grid { stroke: var(--line); stroke-width: 1; }
  .chart .ax { fill: var(--muted); font-size: 12px; font-family: var(--font-body); }
  .chart .l-cw { stroke: var(--accent); stroke-width: 3; fill: none; }
  .chart .l-cu { stroke: var(--muted); stroke-width: 2; stroke-dasharray: 5 4; fill: none; }
  .chart .d-cw { fill: var(--accent); }
  .chart .d-tw { fill: var(--surface); stroke: var(--ink); stroke-width: 2; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .legend i { display: inline-block; width: 18px; height: 0; border-top: 3px solid var(--accent); vertical-align: middle; margin-right: 6px; }
  .legend i.u { border-top: 2px dashed var(--muted); }
  .legend i.t { width: 10px; height: 10px; border: 2px solid var(--ink); border-radius: 50%; }

  /* Bars */
  .bar { height: 12px; border-radius: 6px; background: var(--line); overflow: hidden; display: flex; }
  .bar .e { background: var(--accent); }
  .bar .p { background: repeating-linear-gradient(45deg, var(--soft), var(--soft) 5px, var(--accent) 5px, var(--accent) 7px); opacity: 0.75; }
  .cat { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .cat .bar { grid-column: 1 / -1; }
  .cat .nm { font-weight: 500; }
  .cat .st { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }

  /* Tiles */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .tile .k { font-size: 13px; color: var(--muted); }
  .tile .v { font-family: var(--font-display); font-weight: 800; font-size: 28px; font-variant-numeric: tabular-nums; line-height: 1.1; margin-top: 2px; }

  .dist { display: grid; grid-template-columns: 88px minmax(0, 1fr) 30px; gap: 8px 10px; align-items: center; font-size: 14px; max-width: 520px; }
  .dist .bar { height: 14px; }
  .dist .n { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
  .flag { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--warn); color: var(--warn); margin-right: 4px; }

  /* Report */
  .report { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 22px; }
  .report h2 { margin-bottom: 4px; }
  .report .meta { color: var(--muted); font-size: 14px; margin-bottom: 16px; }
  .report h3 { margin: 22px 0 6px; }
  .report .sum { display: flex; flex-wrap: wrap; gap: 8px 28px; margin: 14px 0 6px; }
  .report .sum div { min-width: 90px; }
  .report .sum .k { font-size: 13px; color: var(--muted); }
  .report .sum .v { font-family: var(--font-display); font-weight: 800; font-size: 26px; font-variant-numeric: tabular-nums; }
  .codebox { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
  .checks { display: flex; flex-wrap: wrap; gap: 8px; }

  .editor { display: grid; gap: 8px; }
  .erow { display: grid; gap: 8px; align-items: center; }
  .erow.lv { grid-template-columns: minmax(0, 1fr) 90px auto; }
  .erow.sc { grid-template-columns: 70px 70px 80px auto; }
  .erow.rq { grid-template-columns: minmax(0, 1fr) 90px auto; }
  .erow input { min-height: 40px; padding: 6px 10px; }
  .split { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 28px; align-items: start; }
  .listcol { display: grid; gap: 6px; }
  .listcol button { text-align: left; }
  .listcol .btn[aria-pressed="true"] { background: var(--soft); border-color: var(--accent); font-weight: 700; }

  @media (max-width: 700px) {
    .tabs {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; margin: 0; max-width: none;
      background: var(--surface); border-top: 1px solid var(--line); border-bottom: 0;
      padding: 0 4px calc(4px + env(safe-area-inset-bottom, 0px)); justify-content: space-around; gap: 0;
    }
    .tabs button { flex: 1 1 0; min-width: 0; padding: 10px 2px 8px; font-size: 12.5px; border-bottom: 0; border-top: 3px solid transparent; }
    .tabs button[aria-current="page"] { border-top-color: var(--accent); }
    .wrap.has-nav { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
    .split { grid-template-columns: 1fr; gap: 18px; }
    .report { padding: 16px; }
    .who-now span { max-width: 100px; }
  }
  @media (max-width: 480px) {
    .two { grid-template-columns: 1fr; }
    .opts .seg.two-up { flex: 1 1 100%; }
    .row { gap: 10px 8px; grid-template-columns: minmax(0, 1fr) 82px 66px; }
    .hero { padding: 16px; }
  }

  @media print {
    body { background: #fff; color: #000; }
    .topbar, .tabs, .noprint { display: none !important; }
    .wrap { padding: 0; max-width: none; }
    .report { border: 0; padding: 0; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
(function () {
"use strict";

var KEY = "gradepath-v1";
var app = document.getElementById("app");

/* ------------------------------------------------------------------ helpers */
var uid = function () { return Math.random().toString(36).slice(2, 9); };
var num = function (v, d) { v = Number(v); return isFinite(v) ? v : d; };
var str = function (v, n) { return String(v == null ? "" : v).slice(0, n || 80); };
var clamp = function (v, a, b) { return Math.min(b, Math.max(a, v)); };
var trimNum = function (n) { return String(Math.round(n * 100) / 100); };
var esc = function (s) {
  return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; });
};
var todayStr = function () { return new Date().toISOString().slice(0, 10); };

function h(tag, props) {
  var el = document.createElement(tag);
  var kids = Array.prototype.slice.call(arguments, 2);
  var val, hasVal = false;
  props = props || {};
  Object.keys(props).forEach(function (k) {
    var v = props[k];
    if (v === null || v === undefined || v === false) return;
    if (k === "class") el.className = v;
    else if (k === "fk") el.setAttribute("data-fk", v);
    else if (k === "html") el.innerHTML = v;
    else if (k === "value") { val = v; hasVal = true; }
    else if (k === "disabled") el.disabled = true;
    else if (k.slice(0, 2) === "on") el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : String(v));
  });
  (function add(list) {
    list.forEach(function (c) {
      if (c === null || c === undefined || c === false) return;
      if (Array.isArray(c)) add(c);
      else el.appendChild(c.nodeType ? c : document.createTextNode(String(c)));
    });
  })(kids);
  if (hasVal) el.value = val;
  return el;
}

/* ------------------------------------------------------- defaults & storage */
function defaultReqs() {
  return [
    { id: "eng", name: "English", credits: 4 }, { id: "math", name: "Math", credits: 4 },
    { id: "sci", name: "Science", credits: 4 }, { id: "soc", name: "Social studies", credits: 4 },
    { id: "pe", name: "Physical education", credits: 1 }, { id: "art", name: "Fine arts", credits: 1 },
    { id: "lang", name: "Language", credits: 2 }, { id: "elec", name: "Electives", credits: 6 }
  ];
}
function defaultScale() {
  return [
    { min: 90, points: 4, letter: "A" }, { min: 80, points: 3, letter: "B" },
    { min: 70, points: 2, letter: "C" }, { min: 60, points: 1, letter: "D" }, { min: 0, points: 0, letter: "F" }
  ];
}
var PRESET = { multiply: { regular: 1, honors: 1.1, ap: 1.15, dc: 1.15 }, gpa4: { regular: 0, honors: 0.5, ap: 1, dc: 1 } };
function presetSchool(mode, id, name) {
  var p = PRESET[mode];
  return {
    id: id, name: name, mode: mode, passing: 60,
    levels: [
      { id: "regular", label: "Regular", f: p.regular }, { id: "honors", label: "Honors", f: p.honors },
      { id: "ap", label: "AP", f: p.ap }, { id: "dc", label: "Dual credit", f: p.dc }
    ],
    scale: defaultScale(), reqs: defaultReqs()
  };
}

function normSchool(s, i) {
  s = s || {};
  var mode = s.mode === "gpa4" ? "gpa4" : "multiply";
  var levels = Array.isArray(s.levels) ? s.levels.slice(0, 12).map(function (l) {
    l = l || {};
    return { id: str(l.id || uid(), 20), label: str(l.label || "Level", 24), f: num(l.f, 0) };
  }) : [];
  if (!levels.length) levels = [{ id: "regular", label: "Regular", f: mode === "multiply" ? 1 : 0 }];
  var scale = Array.isArray(s.scale) && s.scale.length ? s.scale.slice(0, 20).map(function (e) {
    e = e || {};
    return { min: num(e.min, 0), points: num(e.points, 0), letter: str(e.letter, 3) };
  }) : defaultScale();
  var reqs = Array.isArray(s.reqs) ? s.reqs.slice(0, 30).map(function (r) {
    r = r || {};
    return { id: str(r.id || uid(), 20), name: str(r.name || "Category", 40), credits: Math.max(0, num(r.credits, 0)) };
  }) : defaultReqs();
  return { id: str(s.id || uid(), 20), name: str(s.name || "School " + (i + 1), 60), mode: mode, passing: clamp(num(s.passing, 60), 0, 100), levels: levels, scale: scale, reqs: reqs };
}
function normStudent(t, schools) {
  t = t || {};
  var terms = Array.isArray(t.terms) ? t.terms.slice(0, 16).map(function (x) {
    x = x || {};
    return { id: str(x.id || uid(), 20), grade: clamp(Math.round(num(x.grade, 9)), 6, 12), sem: num(x.sem, 1) === 2 ? 2 : 1 };
  }) : [];
  var tids = terms.map(function (x) { return x.id; });
  var classes = Array.isArray(t.classes) ? t.classes.slice(0, 200).filter(function (c) {
    return c && tids.indexOf(c.termId) >= 0;
  }).map(function (c) {
    return {
      id: str(c.id || uid(), 20), termId: c.termId, name: str(c.name, 60), grade: str(c.grade, 8),
      level: str(c.level || "regular", 20), credit: num(c.credit, 1) === 0.5 ? 0.5 : 1, cat: str(c.cat, 20), planned: !!c.planned
    };
  }) : [];
  var pin = t.pin && t.pin.hash ? { salt: str(t.pin.salt, 40), hash: str(t.pin.hash, 100) } : null;

    h("div", { class: "stack-s" }, h("h2", null, "Backup and restore"),
      h("p", { class: "note" }, "Everything lives in this browser. Save a backup before clearing browser data or switching devices. Backups include accounts, grades and grading systems.")),
    h("section", { class: "stack-s" }, h("h3", null, "Export"),
      h("textarea", { class: "codebox", readonly: true, "aria-label": "Backup export", onfocus: function (e) { e.target.select(); } }, json),
      h("div", { class: "actions" },
        h("button", { class: "btn primary", type: "button", onclick: function () { copyText(json, "backup"); } }, ui.copied === "backup" ? "Copied" : "Copy backup"),
        ui.canDownload ? h("button", { class: "btn", type: "button", onclick: function () { saveFile("gradepath-backup.json", json); } }, "Save backup file") : null)),
    h("section", { class: "stack-s" }, h("h3", null, "Restore"),
      box,
      h("div", { class: "actions" },
        confirmBtn("restore", "Replace data with this backup", "Tap again to replace everything", "", function () {
          try {
            var d = JSON.parse(box.value);
            if (!d || !Array.isArray(d.schools)) throw new Error("bad");
            S = normState(d); save(); ui.restoreText = ""; ui.msg = "Backup restored."; ui.adminSchool = ""; ui.editSchool = null; render();
          } catch (e) { ui.msg = "!That doesn't look like a Gradepath backup."; render(); }
        })),
      msg),
    h("section", { class: "stack-s" }, h("h3", null, "Erase everything"),
      confirmBtn("erase", "Erase all data on this device", "Tap again to erase everything", "", function () { S = normState(null); save(); ui.uid = null; go("login"); })));
}

/* -------------------------------------------------------------------- init */
render();
getDownloads().then(function (d) {
  if (!d) return;
  ui.canDownload = true;
  if ((ui.screen === "student" && ui.tab === "reports") || (ui.screen === "admin" && ui.adminTab === "data")) render();
});
})();

</script>
</body>
</html>
